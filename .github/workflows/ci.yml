name: CI

on:
  push:
  pull_request:

jobs:
  lint-format:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # check-types is intentionally not gated yet: some apps have pre-existing
      # type errors. Enable once each is green (see the tooling update doc).
      # - name: Type-check
      #   run: pnpm check-types
